<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>AF — 3615 · DA Lab</title>
<meta name="color-scheme" content="dark" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:swap;src:url('/fonts/jetbrains-mono-latin.woff2') format('woff2-variations')}
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/inter-tight-latin.woff2') format('woff2-variations')}
:root{
  --room:#0e0c0a;--case:#cfc7b4;--case2:#a89f8b;--case3:#e2dbc9;
  --screen:#05070c;--fg:#e8e9e2;--blue:#2a63c8;--magenta:#cf2d7e;--yellow:#f0c02f;--cyan:#2fd2c5;--green:#4bd06b;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Inter Tight',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--room);color:var(--fg);font-family:var(--sans);overflow-x:hidden}
h1,p,pre{margin:0}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}

.proto{position:fixed;inset:0 0 auto;z-index:90;display:flex;align-items:center;gap:16px;
  padding:11px clamp(14px,2.4vw,30px);font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(232,233,226,.4)}
.proto .tag{color:var(--yellow)}
.proto a{text-decoration:none;border-bottom:1px solid rgba(232,233,226,.25);padding-bottom:1px}
.proto a:hover{color:var(--yellow);border-color:var(--yellow)}
.proto .motion{margin-left:auto;display:flex;align-items:center;gap:9px;cursor:pointer}
.proto .motion input{position:absolute;opacity:0;width:1px;height:1px}
.proto .motion i{display:block;width:30px;height:15px;border:1px solid rgba(232,233,226,.35);border-radius:9px;position:relative}
.proto .motion i::after{content:"";position:absolute;inset:2px auto 2px 2px;width:9px;border-radius:50%;background:var(--yellow);transition:translate .18s ease}
.proto .motion input:checked + i::after{translate:15px 0}

.room{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,1.6vh,18px);padding:clamp(52px,7vh,66px) 12px clamp(16px,2.6vh,26px);overflow:hidden;
  background:
    radial-gradient(52% 44% at 50% 44%,rgba(240,192,47,.09),transparent 66%),
    radial-gradient(90% 80% at 50% 110%,rgba(42,99,200,.12),transparent 60%),
    linear-gradient(180deg,#100e0b,#070605)}

.terminal{position:relative;width:min(94vw,960px);border-radius:12px;
  background:linear-gradient(165deg,var(--case3),var(--case) 36%,var(--case2));
  padding:clamp(10px,1.4vw,16px) clamp(10px,1.4vw,16px) clamp(8px,1vw,12px);
  box-shadow:0 50px 80px -40px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,0,0,.25)}
.term-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px 8px;
  font-family:var(--mono);font-size:.44rem;letter-spacing:.2em;text-transform:uppercase;color:#5b5446}
.term-top b{color:#2f2b23;font-weight:700;letter-spacing:.28em}
.term-top .brand{color:#7c7362}
.term-top .led{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3f8f4e;margin-right:6px;
  box-shadow:0 0 6px #4bd06b;animation:led 3.4s steps(1) infinite}
@keyframes led{0%,92%{opacity:1}94%,96%{opacity:.25}98%,100%{opacity:1}}

.screen{position:relative;background:var(--screen);border-radius:8px;overflow:hidden;
  aspect-ratio:4/3;padding:clamp(14px,2.2vw,30px);
  box-shadow:inset 0 0 0 2px #1a1a18,inset 0 0 60px rgba(0,0,0,.9),0 0 0 6px #8d8574,0 0 0 7px #5c5548}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;border-radius:8px;
  background:radial-gradient(110% 100% at 50% 46%,transparent 58%,rgba(0,0,0,.65))}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.42) 0 1px,transparent 1px 3px)}
.glare{position:absolute;inset:0;pointer-events:none;z-index:10;opacity:.4;
  background:linear-gradient(118deg,rgba(255,255,255,.1),transparent 34%,transparent 70%,rgba(255,255,255,.05))}

.page{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;
  font-family:var(--mono);font-size:clamp(.56rem,1.05vw,.94rem);line-height:1.5;letter-spacing:.02em;
  text-transform:uppercase;color:var(--fg);animation:crt 8s infinite}
@keyframes crt{0%,96%{opacity:1}97%{opacity:.86}98%{opacity:1}99%{opacity:.93}}
.bar{display:flex;justify-content:space-between;gap:10px;background:var(--blue);color:#fff;
  padding:.28em .55em;font-weight:700;letter-spacing:.12em}
.bar .p{color:var(--yellow)}
.big{margin-top:.5em;background:var(--blue);color:#fff;font-weight:800;
  font-size:clamp(1.25rem,3.2vw,2.6rem);line-height:.95;letter-spacing:-.02em;padding:.16em .3em .1em}
.big span{display:block}
.big .thin{font-weight:400;color:#bfe6ff;font-size:.46em;letter-spacing:.28em;margin-top:.35em}
.sub{margin-top:.45em;color:var(--yellow);font-weight:700;letter-spacing:.3em;font-size:.86em}
.body{margin-top:.55em;color:#cfd3cc;font-size:.86em;line-height:1.55;max-width:64ch}
.body b{color:#fff;font-weight:700;background:var(--magenta);padding:0 .25em}
.ascii{margin-top:.7em;font-family:var(--mono);font-size:.8em;line-height:1.45;color:#b9d7ff;
  white-space:pre;overflow:hidden;border-left:3px solid var(--cyan);padding-left:.7em}
.ascii em{color:var(--yellow);font-style:normal}
.menu{margin-top:auto;display:flex;flex-wrap:wrap;gap:.3em 1.4em;border-top:1px solid rgba(232,233,226,.24);
  padding-top:.55em;font-size:.82em}
.menu span{white-space:nowrap;color:#d8dbd4}
.menu b{display:inline-block;background:var(--magenta);color:#fff;padding:0 .4em;margin-right:.4em;font-weight:700}
.menu a{text-decoration:none;color:inherit}
.menu a:hover{color:var(--yellow)}
.foot{margin-top:.45em;background:var(--green);color:#04210c;font-weight:700;padding:.2em .5em;
  font-size:.78em;display:flex;justify-content:space-between;gap:10px;letter-spacing:.08em}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.g{color:var(--green)}.c{color:var(--cyan)}.m{color:var(--magenta)}.y{color:var(--yellow)}

.keys{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:clamp(9px,1.2vw,14px) 6px 2px;
  border-top:1px solid rgba(70,62,48,.28);margin-top:10px}
.keys button{font-family:var(--mono);font-size:.52rem;font-weight:700;letter-spacing:.06em;
  width:2.5em;height:2.2em;border:1px solid #8d8474;border-radius:3px;color:#2e2a22;cursor:pointer;
  background:linear-gradient(180deg,#ece5d4,#c9c0ad);box-shadow:0 2px 0 #8d8474,inset 0 1px 0 #fff}
.keys button:hover{background:linear-gradient(180deg,#fff8e6,#d9d0bd)}
.keys button:active{translate:0 1px;box-shadow:0 1px 0 #8d8474}
.keys .wide{width:auto;padding:0 .8em}
.keys .sp{flex:1}
.keys .label{font-family:var(--mono);font-size:.4rem;letter-spacing:.14em;text-transform:uppercase;color:#6a6252}
.note{font-family:var(--mono);font-size:.46rem;letter-spacing:.14em;text-transform:uppercase;color:#6d6658;text-align:center}
.note b{color:#c9c0ad;font-weight:400}

@media (max-width:760px){
  .room{padding-top:56px;justify-content:flex-start}
  .terminal{width:96vw;border-radius:9px}
  .screen{aspect-ratio:auto;height:min(64svh,460px);padding:14px}
  .page{font-size:.55rem}
  .big{font-size:1.35rem}
  .body{font-size:.8em}
  .ascii{font-size:.7em}
  .menu{font-size:.72em;gap:.25em .9em}
  .keys button{width:2.2em;height:2em}
  .keys .label{display:none}
  .note{font-size:.4rem}
}
@media (max-width:420px){
  .screen{height:min(60svh,420px)}
  .ascii{display:none}
  .page{font-size:.5rem}
  .big{font-size:1.15rem}
}
body.still *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="sr" href="#contenu">Aller au contenu</a>
<div class="proto">
  <span class="tag">AF — 3615</span>
  <a href="/da-hero.html">Galerie</a>
  <label class="motion"><input type="checkbox" checked /><i></i>Mouvement</label>
</div>

<main class="room" id="contenu">
  <div class="terminal">
    <div class="term-top">
      <span><b>TELIC</b> · terminal vidéotex</span>
      <span class="brand">DA LAB · 3615 CODE TENIR</span>
      <span><i class="led"></i><span id="status">EN LIGNE</span></span>
    </div>

    <div class="screen">
      <div class="page" id="page" aria-live="polite"></div>
      <span class="glare" aria-hidden="true"></span>
    </div>

    <div class="keys" role="group" aria-label="Clavier de navigation">
      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button>
      <button type="button" class="wide" data-k="0">SOMMAIRE</button>
      <span class="sp"></span>
      <span class="label">Touches 1–4 · 0 sommaire</span>
    </div>
  </div>
  <p class="note">Télétexte — <b>1200 bps</b> · aucune image, aucun script de rendu · 1986 / 2026</p>
  <h1 class="sr">Tenir, sans appui — DA Lab, ingénierie logicielle indépendante.</h1>
</main>

<script>
(function(){
  var page=document.getElementById('page'),status=document.getElementById('status'),
      motion=document.querySelector('.motion input'),
      reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var PAGES={
  0:'<div class="bar"><span>3615 DA LAB</span><span class="p">P.01</span></div>'+
    '<h2 class="big"><span>TENIR</span><span class="thin">SANS APPUI</span></h2>'+
    '<p class="sub">INGENIERIE INDEPENDANTE · 9 ANS</p>'+
    '<p class="body">UN SYSTEME <b>DOCUMENTE</b>, TESTE SUR LE PERIMETRE CONVENU, LIVRE AVEC SA PASSATION. LE JOUR OU NOUS PARTONS, QUELQU UN PEUT REPRENDRE.</p>'+
    '<pre class="ascii">┌ PRESTATIONS ──────────────┐\n│ 01 AUDIT         3 SEM.   │\n│ 02 CONSTRUCTION  6-12 SEM.│\n│ 03 REPRISE       <em>SUR DEVIS</em> │\n└───────────────────────────┘</pre>'+
    '<div class="menu"><span><b>1</b>OFFRES</span><span><b>2</b>CONTACT</span><span><b>3</b>MANIFESTE</span><span><b>4</b>GALERIE</span></div>'+
    '<div class="foot"><span>TAPEZ UN CHIFFRE PUIS ENVOI</span><span class="cursor">_</span></div>',
  1:'<div class="bar"><span>3615 DA LAB · OFFRES</span><span class="p">P.02</span></div>'+
    '<h2 class="big"><span>OFFRES</span><span class="thin">TROIS FACONS DE TENIR</span></h2>'+
    '<p class="body"><span class="y">01 / AUDIT</span> — 3 SEMAINES. LECTURE DU CODE, DES TESTS, DE LA DOCUMENTATION. RAPPORT OPPOSABLE, PRIORITES CHIFFREES.</p>'+
    '<p class="body"><span class="c">02 / CONSTRUCTION</span> — 6 A 12 SEMAINES. PERIMETRE ECRIT, LIVRAISONS HEBDOMADAIRES, PASSATION INCLUSE.</p>'+
    '<p class="body"><span class="m">03 / REPRISE</span> — SUR DEVIS. ON REPREND CE QUI EXISTE, ON DOCUMENTE, ON FINIT PROPREMENT.</p>'+
    '<div class="menu"><span><b>1</b><a href="/offres/">VOIR LE DETAIL</a></span><span><b>2</b><a href="/contact/">ECRIRE</a></span><span><b>0</b>SOMMAIRE</span></div>'+
    '<div class="foot"><span>CHOIX : 1 OU 2</span><span class="cursor">_</span></div>',
  2:'<div class="bar"><span>3615 DA LAB · CONTACT</span><span class="p">P.03</span></div>'+
    '<h2 class="big"><span>CONTACT</span><span class="thin">UNE REVUE, PAS UN PITCH</span></h2>'+
    '<p class="body">DECRIVEZ LE SYSTEME EN <b>TROIS LIGNES</b> : CE QU IL FAIT, CE QUI CASSE, CE QUI DOIT SURVIVRE. REPONSE SOUS 48 H OUVRABLES.</p>'+
    '<pre class="ascii">> CONTACT / REVUE TECHNIQUE\n> PERIMETRE : _\n> DELAI : 3 SEMAINES\n<span class="g">> DISPONIBLE : OUI</span></pre>'+
    '<div class="menu"><span><b>1</b><a href="/contact/">FORMULAIRE</a></span><span><b>2</b><a href="/offres/">OFFRES</a></span><span><b>0</b>SOMMAIRE</span></div>'+
    '<div class="foot"><span>ENVOI DIRECT ACTIF</span><span class="cursor">_</span></div>',
  3:'<div class="bar"><span>3615 DA LAB · MANIFESTE</span><span class="p">P.04</span></div>'+
    '<h2 class="big"><span>MANIFESTE</span><span class="thin">CE QUI RESTE</span></h2>'+
    '<p class="body">UN LOGICIEL N EST PAS UN LIVRABLE. C EST UN <b>LIEU</b> OU D AUTRES VONT TRAVAILLER. NOUS CONSTRUISONS DES LIEUX HABITABLES : PERIMETRE CLAIR, PREUVES, MODE D EMPLOI.</p>'+
    '<p class="body">PAS DE DEPENDANCE CACHEE. PAS DE MAGIE. PAS DE CONNAISSANCE PRIVEE. UN SYSTEME QUI TIENT EST UN SYSTEME QU ON PEUT QUITTER.</p>'+
    '<div class="menu"><span><b>1</b><a href="/offres/">OFFRES</a></span><span><b>2</b><a href="/contact/">CONTACT</a></span><span><b>0</b>SOMMAIRE</span></div>'+
    '<div class="foot"><span>FIN DE PAGE · 3615 DA LAB</span><span class="cursor">_</span></div>'
  };
  var MAP={'0':0,'1':1,'2':2,'3':3,'4':4};
  function show(n){
    page.innerHTML=PAGES[n]||PAGES[0];
    status.textContent=n===0?'EN LIGNE':'PAGE 0'+(n+1);
  }
  function go(k){
    var n=MAP[k];
    if(n===4){window.location.href='/da-hero.html';return;}
    if(n===undefined)return;
    show(n);
  }
  document.querySelectorAll('.keys button').forEach(function(b){
    b.addEventListener('click',function(){go(b.dataset.k);});
  });
  document.addEventListener('keydown',function(e){
    if(/^[0-4]$/.test(e.key)&&document.activeElement.tagName!=='INPUT')go(e.key);
  });

  motion.addEventListener('change',function(){
    document.body.classList.toggle('still',!motion.checked);
  });

  if(reduce){show(0);return;}
  page.innerHTML='<div class="bar"><span>3615 DA LAB</span><span class="p">CONNEXION</span></div>'+
    '<pre class="ascii" style="margin-top:2em;border-left-color:#f0c02f">APPEL 3615 ...\nPORTEUSE <span class="c">DETECTEE</span>\nDEBIT 1200 BPS\n<span class="y">CONNEXION ETABLIE</span>\n\nCHARGEMENT PAGE 01 ...</pre>';
  setTimeout(function(){show(0);},reduce?0:1250);
})();
</script>
</body>
</html>
